[package]
name = "kosync-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
aide = { version = "0.15.1", features = ["axum", "axum-json", "axum-query", "macros"] }
axum = { version = "0.8.9", features = ["macros"] }
bcrypt = "0.19.3"
chrono = { version = "0.4.45", "features" = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.33"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rustls = "0.23.45"
schemars = { version = "0.9.0", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["json", "chrono", "env-filter"] }
url = "2.5.8"
webpki-roots = "1.0.9"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

# bcrypt at its default cost takes seconds per hash unoptimized, which makes
# every registration and authenticated request in a debug build or test crawl
[profile.dev.package.bcrypt]
opt-level = 3
